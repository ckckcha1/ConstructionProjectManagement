server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # data.js calls relative /api/... URLs. In development setupProxy.js forwards them;
    # in Docker, nginx forwards them to the Express container ("server" in docker-compose.yml).
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRA's hashed JS/CSS files can be cached
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
